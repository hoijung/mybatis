<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>관리 시스템</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            display: flex;
            height: 100vh;
            background-color: #f4f6f9;
            color: #333;
            overflow: hidden;
        }

        /* 사이드바 */
        .sidebar {
            width: 240px;
            background-color: #1e293b;
            color: #f8fafc;
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
            box-shadow: 2px 0 8px rgba(0, 0, 0, 0.1);
            transition: width 0.25s ease;
            overflow: hidden;
        }

        .sidebar.collapsed {
            width: 56px;
        }

        .sidebar-brand {
            padding: 20px 16px;
            font-size: 18px;
            font-weight: 700;
            color: #fff;
            border-bottom: 1px solid #334155;
            display: flex;
            align-items: center;
            gap: 10px;
            background-color: #0f172a;
            white-space: nowrap;
            overflow: hidden;
        }

        .sidebar-brand .brand-text {
            transition: opacity 0.2s ease;
        }

        .sidebar.collapsed .brand-text {
            opacity: 0;
            width: 0;
        }

        .menu-category {
            padding: 16px 16px 8px;
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
            color: #94a3b8;
            letter-spacing: 0.5px;
            white-space: nowrap;
            overflow: hidden;
            transition: opacity 0.2s ease;
        }

        .sidebar.collapsed .menu-category {
            opacity: 0;
        }

        .menu-list {
            list-style: none;
            padding: 0 8px;
        }

        .menu-item {
            margin-bottom: 4px;
        }

        .menu-link {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px 10px;
            color: #cbd5e1;
            text-decoration: none;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 500;
            transition: all 0.2s;
            cursor: pointer;
            white-space: nowrap;
            overflow: hidden;
        }

        .menu-link:hover {
            background-color: #334155;
            color: #fff;
        }

        .menu-link.active {
            background-color: #2563eb;
            color: #fff;
            font-weight: 600;
        }

        .menu-icon {
            font-size: 16px;
            flex-shrink: 0;
        }

        .menu-label {
            transition: opacity 0.2s ease;
            overflow: hidden;
        }

        .sidebar.collapsed .menu-label {
            opacity: 0;
            width: 0;
        }

        /* 접기 버튼 */
        .toggle-btn {
            position: absolute;
            top: 18px;
            left: 216px;
            width: 24px;
            height: 24px;
            background-color: #334155;
            border: none;
            border-radius: 50%;
            color: #cbd5e1;
            font-size: 13px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 100;
            transition: left 0.25s ease, background-color 0.2s;
            box-shadow: 0 1px 4px rgba(0,0,0,0.3);
        }

        .toggle-btn:hover {
            background-color: #475569;
            color: #fff;
        }

        body.sidebar-collapsed .toggle-btn {
            left: 44px;
        }

        /* 메인 콘텐츠 영역 */
        .main-wrapper {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* 상단 GNB 헤더 */
        .header {
            height: 60px;
            background-color: #fff;
            border-bottom: 1px solid #e2e8f0;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 28px;
        }

        .header-title {
            font-size: 16px;
            font-weight: 600;
            color: #475569;
        }

        .header-user {
            font-size: 14px;
            color: #64748b;
        }

        /* 프레임 콘텐츠 */
        .content-frame {
            flex: 1;
            border: none;
            width: 100%;
            height: 100%;
            background-color: #fff;
        }
    </style>
</head>

<body>

    <!-- 접기/펼치기 버튼 -->
    <button class="toggle-btn" id="toggleBtn" onclick="toggleSidebar()" title="메뉴 접기/펼치기">◀</button>

    <!-- 좌측 사이드바 메뉴 -->
    <nav class="sidebar" id="sidebar">
        <div class="sidebar-brand">
            <span>📦</span>
            <span class="brand-text">ERP 대시보드</span>
        </div>

        <div class="menu-category">현황 / 통계</div>
        <ul class="menu-list">
            <li class="menu-item">
                <a class="menu-link active" onclick="navigate(this, 'chart.html')" title="주문 월별 현황">
                    <span class="menu-icon">📊</span>
                    <span class="menu-label">주문 월별 현황</span>
                </a>
            </li>
            <li class="menu-item">
                <a class="menu-link" onclick="navigate(this, 'pie.html')" title="상세 현황">
                    <span class="menu-icon">🥧</span>
                    <span class="menu-label">품목 현황</span>
                </a>
            </li>
            <li class="menu-item">
                <a class="menu-link" onclick="navigate(this, 'teampie.html')" title="인쇄팀별 현황">
                    <span class="menu-icon">👥</span>
                    <span class="menu-label">인쇄팀별 현황</span>
                </a>
            </li>
            <!-- <li class="menu-item">
                <a class="menu-link" onclick="navigate(this, 'statepie.html')" title="상태별 현황">
                    <span class="menu-icon">🧾</span>
                    <span class="menu-label">상태별 현황</span>
                </a>
            </li> -->
        </ul>
    </nav>

    <!-- 메인 영역 -->
    <div class="main-wrapper">
        <header class="header">
            <div class="header-title" id="currentMenuTitle">주문 월별 현황</div>
            <div class="header-user">관리자 계정</div>
        </header>

        <!-- 콘텐츠 iframe -->
        <iframe id="mainFrame" class="content-frame" src="chart.html"></iframe>
    </div>

    <script>
        function navigate(element, url) {
            document.querySelectorAll('.menu-link').forEach(link => link.classList.remove('active'));
            element.classList.add('active');

            const titleText = element.querySelector('.menu-label').innerText;
            document.getElementById('currentMenuTitle').innerText = titleText;

            document.getElementById('mainFrame').src = url;
        }

        function toggleSidebar() {
            const sidebar = document.getElementById('sidebar');
            const btn = document.getElementById('toggleBtn');
            const isCollapsed = sidebar.classList.toggle('collapsed');
            document.body.classList.toggle('sidebar-collapsed', isCollapsed);
            btn.textContent = isCollapsed ? '▶' : '◀';
        }
    </script>
</body>

</html>
