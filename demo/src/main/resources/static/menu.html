<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>시스템 메뉴</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            display: flex;
            height: 100vh;
            background-color: #f4f6f9;
            color: #333;
            overflow: hidden;
        }

        /* 사이드바 */
        .sidebar {
            width: 240px;
            background-color: #1e293b;
            color: #f8fafc;
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
            box-shadow: 2px 0 8px rgba(0, 0, 0, 0.1);
        }

        .sidebar-brand {
            padding: 20px 24px;
            font-size: 18px;
            font-weight: 700;
            color: #fff;
            border-bottom: 1px solid #334155;
            display: flex;
            align-items: center;
            gap: 10px;
            background-color: #0f172a;
        }

        .menu-category {
            padding: 16px 24px 8px;
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
            color: #94a3b8;
            letter-spacing: 0.5px;
        }

        .menu-list {
            list-style: none;
            padding: 0 12px;
        }

        .menu-item {
            margin-bottom: 4px;
        }

        .menu-link {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px 14px;
            color: #cbd5e1;
            text-decoration: none;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 500;
            transition: all 0.2s;
            cursor: pointer;
        }

        .menu-link:hover {
            background-color: #334155;
            color: #fff;
        }

        .menu-link.active {
            background-color: #2563eb;
            color: #fff;
            font-weight: 600;
        }

        .menu-icon {
            font-size: 16px;
        }

        /* 메인 콘텐츠 영역 */
        .main-wrapper {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* 상단 헤더 */
        .header {
            height: 60px;
            background-color: #fff;
            border-bottom: 1px solid #e2e8f0;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 28px;
        }

        .header-title {
            font-size: 16px;
            font-weight: 600;
            color: #475569;
        }

        .header-user {
            font-size: 14px;
            color: #64748b;
        }

        /* 프레임 콘텐츠 */
        .content-frame {
            flex: 1;
            border: none;
            width: 100%;
            height: 100%;
            background-color: #fff;
        }
    </style>
</head>
<body>

    <!-- 좌측 사이드바 메뉴 -->
    <nav class="sidebar">
        <div class="sidebar-brand">
            <span>📦</span> ERP 대시보드
        </div>

        <div class="menu-category">현황 / 통계</div>
        <ul class="menu-list">
            <li class="menu-item">
                <a class="menu-link active" onclick="navigate(this, 'chart.html')">
                    <span class="menu-icon">📊</span>
                    <span>주문 월별 현황</span>
                </a>
            </li>
        </ul>
        <ul class="menu-list">
            <li class="menu-item">
                <a class="menu-link active" onclick="navigate(this, 'pie.html')">
                    <span class="menu-icon">📊</span>
                    <span>상 현황</span>
                </a>
            </li>
            <li class="menu-item">
                <a class="menu-link" onclick="navigate(this, 'statepie.html')">
                    <span class="menu-icon">🧾</span>
                    <span>상태별 현황</span>
                </a>
            </li>
        </ul>

        <!-- <div class="menu-category" style="margin-top: 12px;">주문 관리</div>
        <ul class="menu-list">
            <li class="menu-item">
                <a class="menu-link" onclick="alert('준비 중인 메뉴입니다.')">
                    <span class="menu-icon">📋</span>
                    <span>주문 내역 조회</span>
                </a>
            </li>
            <li class="menu-item">
                <a class="menu-link" onclick="alert('준비 중인 메뉴입니다.')">
                    <span class="menu-icon">🚚</span>
                    <span>배분 관리</span>
                </a>
            </li>
        </ul> -->
    </nav>

    <!-- 메인 영역 -->
    <div class="main-wrapper">
        <header class="header">
            <div class="header-title" id="currentMenuTitle">주문 월별 현황</div>
            <div class="header-user">관리자</div>
        </header>
        
        <!-- 콘텐츠 iframe -->
        <iframe id="mainFrame" class="content-frame" src="chart.html"></iframe>
    </div>

    <script>
        function navigate(element, url) {
            document.querySelectorAll('.menu-link').forEach(link => link.classList.remove('active'));
            element.classList.add('active');

            const titleText = element.querySelector('span:last-child').innerText;
            document.getElementById('currentMenuTitle').innerText = titleText;

            document.getElementById('mainFrame').src = url;
        }
    </script>
</body>
</html>
